[project]
name = "ganlive"
version = "0.1.0"
description = "Real-time latent-space exploration: any GAN, any accelerator, any MIDI controller."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pygame>=2.5", "python-rtmidi>=1.5"]

[project.optional-dependencies]
audio = ["sounddevice>=0.5"]
record = ["av>=13"]
# The portable ONNX runtime. `models/runtime.py` tries TensorRT, CUDA, ROCm, MIGraphX,
# CoreML and DirectML in turn, so this reaches most cards; `onnx-intel` swaps in the
# OpenVINO build, which is the one the timings in the README were taken on.
onnx = ["onnx>=1.17", "onnxruntime>=1.20"]
onnx-intel = ["onnx>=1.17", "onnxruntime-openvino>=1.20", "openvino>=2024.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ganlive = "ganlive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ganlive"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ganlive/**/*.py" = ["E741", "B008"]
"tests/*.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "ganlive"
dynamic = ["version"]  # read from ganlive.__version__
description = "Plug-and-play interface for real-time GAN latent-space exploration."
readme = "README.md"
# pygame 2.6 has no wheel for Python 3.14 yet.
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustave Cortal" }]
keywords = ["gan", "stylegan2", "fastgan", "latent-space", "midi", "vj", "live-visuals",
            "generative-art", "real-time", "onnx", "generative-adversarial-networks",
            "latent-space-exploration", "plug-and-play"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is not listed: the right build depends on your GPU, so the README installs it first.
dependencies = ["numpy>=1.26", "pygame>=2.5", "psutil>=6"]

[project.urls]
Homepage = "https://github.com/gustavecortal/ganlive"
Documentation = "https://github.com/gustavecortal/ganlive/blob/main/docs/guide.md"
Issues = "https://github.com/gustavecortal/ganlive/issues"

[project.optional-dependencies]
audio = ["sounddevice>=0.5"]
record = ["av>=13"]
# ONNX Runtime picks TensorRT, CUDA, ROCm, MIGraphX, CoreML or DirectML where present.
onnx = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.7"]
# The same through OpenVINO: the fastest path on Intel GPUs.
onnx-intel = ["onnx>=1.17", "onnxruntime-openvino>=1.20", "openvino>=2024.6", "onnxscript>=0.7"]
hub = ["ganlive[onnx]", "huggingface_hub>=0.25"]
all = ["ganlive[audio,record,onnx,hub]"]
dev = ["ganlive[all]", "pytest>=8", "ruff>=0.6", "pillow>=10"]

[project.scripts]
ganlive = "ganlive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ganlive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ganlive"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ganlive/**/*.py" = ["E741", "B008"]
"tests/*.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
